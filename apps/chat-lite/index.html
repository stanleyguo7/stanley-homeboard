<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thundy" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b84ff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <title>Thundy</title>
  <script src="./config.js"></script>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#667085; --brand:#0b84ff; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);overscroll-behavior:none}

    .shell{position:relative;min-height:100dvh;overflow:hidden}
    .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

    .top{position:sticky;top:0;background:var(--card);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid #e7e7e7;z-index:10}
    .toprow{display:flex;align-items:center;gap:10px}
    .navbtn{width:34px;height:34px;border-radius:10px;border:1px solid #d9e6ff;background:#eef5ff;color:#0b63c9;padding:0;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
    .titlewrap{min-width:0;flex:1}
    .title{font-weight:700;display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:#18b663;box-shadow:0 0 0 2px rgba(24,182,99,.15)}
    .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .msgs{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;min-height:0}
    .bubble{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
    .ai{align-self:flex-start;background:var(--card);border:1px solid #ececec;border-bottom-left-radius:6px}
    .sys{align-self:center;font-size:12px;color:var(--muted)}

    .bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid #e7e7e7;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;z-index:10}
    textarea{flex:1;resize:none;border:1px solid #d8d8d8;border-radius:12px;padding:10px;min-height:44px;max-height:120px;font-size:15px}
    button{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:0 14px;font-size:15px}
    button:disabled{opacity:.5}

    .jump{position:fixed;right:16px;bottom:88px;z-index:30;background:#0b84ff;color:#fff;border:none;border-radius:18px;padding:8px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);display:none}
    .jump.show{display:block}

    .drawerBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
    .drawerBackdrop.show{opacity:1;pointer-events:auto}

    .drawer{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);background:#fff;box-shadow:2px 0 20px rgba(0,0,0,.15);transform:translateX(-101%);transition:transform .22s;z-index:50;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
    .drawer.show{transform:translateX(0)}
    .drawerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .drawerTitle{font-size:14px;font-weight:700}
    .drawerClose{width:32px;height:32px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#334155;padding:0}

    .drawerTools{display:flex;gap:8px;margin-bottom:8px}
    .mini{padding:6px 8px;border-radius:8px;font-size:12px;background:#eef5ff;color:#0b63c9;border:1px solid #cfe3ff}
    .topicInput{width:100%;border:1px solid #d8d8d8;border-radius:8px;padding:8px 9px;font-size:13px;margin-bottom:8px}

    .sessionList{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-bottom:8px}
    .sessionItem{border:1px solid #e8edf5;background:#fff;color:#1e293b;border-radius:10px;padding:10px 10px;font-size:13px;line-height:1.35;text-align:left}
    .sessionItem.active{border-color:#bfdbfe;background:#eff6ff;color:#0b63c9}
  </style>
</head>
<body>
<div class="shell">
  <div id="drawerBackdrop" class="drawerBackdrop"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawerHead">
      <div class="drawerTitle">会话</div>
      <button id="drawerCloseBtn" class="drawerClose">×</button>
    </div>
    <div class="drawerTools">
      <button id="modeBtn" class="mini">简洁模式</button>
      <button id="addSessionBtn" class="mini">+会话</button>
    </div>
    <input id="topicInput" class="topicInput" placeholder="当前会话话题（可选）" />
    <div id="sessionList" class="sessionList"></div>
  </aside>

  <div class="app">
    <div class="top">
      <div class="toprow">
        <button id="navBtn" class="navbtn">☰</button>
        <div class="titlewrap">
          <div class="title">Thundy <span class="dot"></span></div>
          <div id="status" class="sub">连接中…</div>
        </div>
      </div>
    </div>
    <div id="msgs" class="msgs"></div>
    <button id="jumpBtn" class="jump">回到底部</button>
    <div class="bar">
      <textarea id="input" placeholder="输入消息…"></textarea>
      <button id="send">发送</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cfg = window.CHATLITE_CONFIG || {};
  const host = cfg.host || location.hostname || '100.96.233.69';
  const gatewayPort = cfg.gatewayPort || 18789;
  const gatewayProtocol = cfg.gatewayProtocol || (location.protocol === 'https:' ? 'wss' : 'ws');
  const wsUrl = cfg.gatewayUrl || `${gatewayProtocol}://${host}:${gatewayPort}`;
  const token = cfg.token || '';
  const REFRESH_MS = cfg.refreshMs || 1800;
  const MAX_RENDER_MESSAGES = cfg.maxRenderMessages || 120;
  const DEFAULT_SESSION = cfg.sessionKey || 'agent:main:main';

  const statusEl = document.getElementById('status');
  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const jumpBtn = document.getElementById('jumpBtn');

  const navBtn = document.getElementById('navBtn');
  const drawer = document.getElementById('drawer');
  const drawerBackdrop = document.getElementById('drawerBackdrop');
  const drawerCloseBtn = document.getElementById('drawerCloseBtn');
  const sessionList = document.getElementById('sessionList');
  const topicInput = document.getElementById('topicInput');
  const addSessionBtn = document.getElementById('addSessionBtn');
  const modeBtn = document.getElementById('modeBtn');

  let ws;
  let pending = new Map();
  let reqId = 1;
  let lastRenderSig = '';
  let lastServerMessages = [];
  let outbox = [];
  let firstPaint = true;
  let refreshTimer = null;
  let sessionKeys = [];
  let currentSessionKey = localStorage.getItem('chatlite.currentSession') || DEFAULT_SESSION;
  let conciseMode = localStorage.getItem('chatlite.conciseMode') !== '0';
  let drawerOpen = false;

  let touchStartX = 0;
  let touchStartY = 0;

  function setStatus(t){ statusEl.textContent = t; }
  function genId(){ return `c${Date.now()}_${reqId++}`; }
  function topicStoreKey(sk){ return `chatlite.topic.${sk}`; }

  function addSys(text){
    const d = document.createElement('div'); d.className='sys'; d.textContent=text;
    msgsEl.appendChild(d); msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function textFromContent(content){
    if (!Array.isArray(content)) return '';
    return content.map(c => (c && c.type === 'text' && typeof c.text === 'string') ? c.text : '').filter(Boolean).join('\n');
  }

  function isNearBottom(){
    return msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 28;
  }

  function updateJumpBtn(){
    if (isNearBottom()) jumpBtn.classList.remove('show');
    else jumpBtn.classList.add('show');
  }

  function delayedScrollToBottom(delay = 260){
    setTimeout(() => {
      msgsEl.scrollTop = msgsEl.scrollHeight;
      updateJumpBtn();
    }, delay);
  }

  function topicLabel(sessionKey){
    const t = (localStorage.getItem(topicStoreKey(sessionKey)) || '').trim();
    return t || sessionKey;
  }

  function renderSessionList(){
    sessionList.innerHTML = '';
    sessionKeys.forEach(k => {
      const b = document.createElement('button');
      b.className = 'sessionItem' + (k === currentSessionKey ? ' active' : '');
      b.textContent = topicLabel(k);
      b.title = k;
      b.onclick = () => {
        switchSession(k);
        closeDrawer();
      };
      sessionList.appendChild(b);
    });
    topicInput.value = localStorage.getItem(topicStoreKey(currentSessionKey)) || '';
  }

  function ensureSession(k){
    if (!k) return;
    if (!sessionKeys.includes(k)) sessionKeys.unshift(k);
    sessionKeys = [...new Set(sessionKeys)].slice(0, 40);
    renderSessionList();
  }

  function switchSession(k){
    currentSessionKey = k;
    localStorage.setItem('chatlite.currentSession', currentSessionKey);
    lastRenderSig = '';
    firstPaint = true;
    renderSessionList();
    refresh();
  }

  function renderModeBtn(){
    modeBtn.textContent = conciseMode ? '简洁模式✓' : '完整模式';
  }

  function openDrawer(){
    drawerOpen = true;
    drawer.classList.add('show');
    drawerBackdrop.classList.add('show');
    drawer.setAttribute('aria-hidden', 'false');
  }

  function closeDrawer(){
    drawerOpen = false;
    drawer.classList.remove('show');
    drawerBackdrop.classList.remove('show');
    drawer.setAttribute('aria-hidden', 'true');
  }

  function stripConversationNoise(text){
    let t = String(text || '');
    t = t.replace(/Conversation info \(untrusted metadata\):\s*```json[\s\S]*?```/gi, '');
    t = t.replace(/^System:\s*\[.*?\]\s*Exec .*$/gmi, '');
    t = t.replace(/^\s*(NO_REPLY|HEARTBEAT_OK)\s*$/gmi, '');
    t = t.replace(/^\s*\[[^\]]*GMT[+-]\d+[^\]]*\]\s*/gmi, '');
    t = t.replace(/\n{3,}/g, '\n\n').trim();
    return t;
  }

  function shapeMessages(messages){
    let compact = (messages || [])
      .map(m => ({ ...m, text: conciseMode ? stripConversationNoise(m.text) : m.text }))
      .filter(m => m.text)
      .slice(-MAX_RENDER_MESSAGES);

    if (!conciseMode) return compact;

    compact = compact.filter(m => m.role === 'user' || m.role === 'assistant');
    const folded = [];
    compact.forEach((m) => {
      const prev = folded[folded.length - 1];
      if (m.role === 'assistant' && prev && prev.role === 'assistant') {
        folded[folded.length - 1] = m;
      } else {
        folded.push(m);
      }
    });
    return folded;
  }

  function reconcileOutbox(messages){
    const serverUserTexts = new Set(
      (messages || [])
        .filter(m => m.role === 'user')
        .map(m => textFromContent(m.content))
        .filter(Boolean)
    );

    outbox = outbox.filter(item => {
      if (item.sessionKey !== currentSessionKey) return true;
      if (!serverUserTexts.has(item.text)) return true;
      if (item.status === 'failed') return true;
      const ackedAt = item.ackedAt || Date.now();
      return Date.now() - ackedAt < 1500;
    });
  }

  function materializeMessages(messages){
    const base = (messages || []).map(m => ({ role: m.role, text: textFromContent(m.content), local: false }));
    const locals = outbox
      .filter(o => o.sessionKey === currentSessionKey)
      .map(o => ({ role: 'user', text: o.text, local: true, status: o.status, id: o.id }));
    return [...base, ...locals].filter(m => m.text);
  }

  function render(messages){
    const compact = shapeMessages(materializeMessages(messages));

    const sig = JSON.stringify(compact.map(m => [m.role, m.text, m.local ? m.status : '']));
    if (sig === lastRenderSig) return;

    const stickBottom = firstPaint || isNearBottom();
    lastRenderSig = sig;
    msgsEl.innerHTML = '';

    compact.forEach(m => {
      const d = document.createElement('div');
      d.className = 'bubble ' + (m.role === 'user' ? 'me' : 'ai');
      if (m.local) {
        const suffix = m.status === 'sent' ? ' ✅' : (m.status === 'failed' ? ' ❌' : ' ⏳');
        d.textContent = m.text + suffix;
      } else {
        d.textContent = m.text;
      }
      msgsEl.appendChild(d);
    });

    if (stickBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    firstPaint = false;
    updateJumpBtn();
  }

  function rpc(method, params){
    return new Promise((resolve, reject) => {
      const id = genId();
      pending.set(id, {resolve, reject});
      ws.send(JSON.stringify({type:'req', id, method, params}));
      setTimeout(() => {
        if (pending.has(id)) { pending.delete(id); reject(new Error('timeout')); }
      }, 15000);
    });
  }

  async function loadSessions(){
    const seeded = Array.isArray(cfg.sessions) ? cfg.sessions : [];
    sessionKeys = [currentSessionKey, DEFAULT_SESSION, ...seeded].filter(Boolean);
    renderSessionList();

    try {
      const res = await rpc('sessions.list', { limit: 30 });
      const fromApi = (res?.sessions || []).map(s => s.key).filter(Boolean);
      sessionKeys = [...new Set([currentSessionKey, ...fromApi, ...sessionKeys])];
      renderSessionList();
    } catch (_) {}
  }

  async function refresh(){
    try {
      const res = await rpc('chat.history', { sessionKey: currentSessionKey, limit: MAX_RENDER_MESSAGES });
      if (res && res.messages) {
        lastServerMessages = res.messages;
        reconcileOutbox(lastServerMessages);
        render(lastServerMessages);
      }
    } catch(e) {}
  }

  async function send(){
    const msg = inputEl.value.trim();
    if (!msg || ws.readyState !== 1) return;

    const localId = genId();
    outbox.push({ id: localId, sessionKey: currentSessionKey, text: msg, status: 'pending', ts: Date.now(), ackedAt: 0 });
    inputEl.value = '';
    render(lastServerMessages);

    sendBtn.disabled = true;
    try {
      await rpc('chat.send', { sessionKey: currentSessionKey, message: msg, idempotencyKey: localId });
      const item = outbox.find(x => x.id === localId);
      if (item) {
        item.status = 'sent';
        item.ackedAt = Date.now();
      }
      render(lastServerMessages);
      await refresh();
      delayedScrollToBottom(120);
    } catch(e) {
      const item = outbox.find(x => x.id === localId);
      if (item) item.status = 'failed';
      render(lastServerMessages);
      addSys('发送失败：' + e.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  function connect(){
    ws = new WebSocket(wsUrl);
    ws.onopen = () => setStatus('已连接，正在握手…');
    ws.onmessage = async (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }

      if (m.type === 'event' && m.event === 'connect.challenge') {
        const id = genId();
        ws.send(JSON.stringify({
          type:'req', id, method:'connect',
          params:{
            minProtocol:3, maxProtocol:3,
            client:{ id:'openclaw-control-ui', version:'1.0.0', platform:'web', mode:'ui' },
            role:'operator',
            scopes:['operator.read','operator.write','operator.admin'],
            auth:{ token }, locale:'zh-CN', userAgent:'chat-lite'
          }
        }));
        return;
      }

      if (m.type === 'res') {
        const p = pending.get(m.id);
        if (p) {
          pending.delete(m.id);
          if (m.ok) p.resolve(m.payload); else p.reject(new Error(m.error?.message || 'rpc error'));
        }
        if (m.ok && m.payload?.type === 'hello-ok') {
          setStatus('已连接');
          loadSessions();
          refresh();
          delayedScrollToBottom(320);
          delayedScrollToBottom(760);
          if (refreshTimer) clearInterval(refreshTimer);
          refreshTimer = setInterval(refresh, REFRESH_MS);
        }
      }

      if (m.type === 'event' && m.event === 'chat' && m.payload?.sessionKey === currentSessionKey) {
        refresh();
      }
    };
    ws.onclose = () => {
      setStatus('连接断开，3秒后重连');
      if (refreshTimer) clearInterval(refreshTimer);
      setTimeout(connect, 3000);
    };
    ws.onerror = () => setStatus('连接错误');
  }

  sendBtn.onclick = send;
  jumpBtn.onclick = () => {
    msgsEl.scrollTop = msgsEl.scrollHeight;
    updateJumpBtn();
  };

  navBtn.onclick = () => drawerOpen ? closeDrawer() : openDrawer();
  drawerBackdrop.onclick = closeDrawer;
  drawerCloseBtn.onclick = closeDrawer;

  modeBtn.addEventListener('click', async () => {
    conciseMode = !conciseMode;
    localStorage.setItem('chatlite.conciseMode', conciseMode ? '1' : '0');
    renderModeBtn();
    lastRenderSig = '';
    await refresh();
  });

  addSessionBtn.addEventListener('click', () => {
    const k = prompt('输入 session key（例如 agent:main:main）');
    if (!k) return;
    ensureSession(k.trim());
    switchSession(k.trim());
  });

  topicInput.addEventListener('change', () => {
    localStorage.setItem(topicStoreKey(currentSessionKey), topicInput.value || '');
    renderSessionList();
  });

  msgsEl.addEventListener('scroll', updateJumpBtn);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  document.addEventListener('touchstart', (e) => {
    if (!e.touches || !e.touches[0]) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive:true });

  document.addEventListener('touchend', (e) => {
    if (!e.changedTouches || !e.changedTouches[0]) return;
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - touchStartX;
    const dy = endY - touchStartY;

    if (!drawerOpen && touchStartX <= 24 && dx > 60 && Math.abs(dy) < 50) openDrawer();
    if (drawerOpen && dx < -70 && Math.abs(dy) < 50) closeDrawer();
  }, { passive:true });

  renderModeBtn();
  renderSessionList();

  if (!token) setStatus('缺少 token（请检查 config.js）');
  else connect();
})();
</script>
</body>
</html>
